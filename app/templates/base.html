<!DOCTYPE html>
<html lang="ru" data-theme="{{ get_theme() }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#060b0d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/icon.svg">
    <title>{% block title %}Movie Radar{% endblock %}</title>
    <style>
        /* ═══ Дизайн-система: Изумрудная аврора ═══ */
        :root,
        [data-theme="dark"] {
            --bg: #060b0d;
            --bg-card: rgba(255, 255, 255, .05);
            --bg-hover: rgba(255, 255, 255, .08);
            --bg-section: rgba(255, 255, 255, .05);
            --text: #e9fffa;
            --text-muted: #8fb8ae;
            --text-faint: #6b9489;
            --text-dim: #5a7d73;
            --accent: #2dd4bf;
            --accent-bg: rgba(45, 212, 191, .12);
            --accent-text: #2dd4bf;
            --c1: #2dd4bf;
            --c2: #34d399;
            --c3: #7dd3fc;
            --border: rgba(45, 212, 191, .15);
            --border-light: rgba(143, 184, 174, .2);
            --success: #6ee7b7;
            --warning-bg: rgba(251, 191, 36, .12);
            --warning-text: #fbbf24;
            --error: #fda4af;
            --delete-btn-bg: rgba(253, 164, 175, .15);
            --delete-btn-hover: rgba(253, 164, 175, .25);
            --refresh-btn-bg: rgba(255, 255, 255, .06);
            --refresh-btn-hover: rgba(255, 255, 255, .1);
            --no-poster-bg: rgba(255, 255, 255, .08);
            --no-poster-text: #6b9489;
            --tag-bg: rgba(255, 255, 255, .06);
            --progress-bg: rgba(255, 255, 255, .09);
            --code-bg: rgba(255, 255, 255, .08);
            --opt-bg: #0d1417;
            --radius: 18px;
            --radius-sm: 13px;
            --radius-xs: 9px;
        }

        [data-theme="light"] {
            --bg: #f7f8fa;
            --bg-card: #fff;
            --bg-hover: #e8ecf3;
            --bg-section: #fff;
            --text: #1a1d26;
            --text-muted: #565d6b;
            --text-faint: #8a91a0;
            --text-dim: #a0a7b5;
            --accent: #059669;
            --accent-bg: rgba(5, 150, 105, .1);
            --accent-text: #059669;
            --c1: #059669;
            --c2: #10b981;
            --c3: #0891b2;
            --border: #dde2ea;
            --border-light: #c6cdd9;
            --success: #16a34a;
            --warning-bg: rgba(217, 119, 6, .1);
            --warning-text: #b45309;
            --error: #dc2626;
            --delete-btn-bg: #dc2626;
            --delete-btn-hover: #b91c1c;
            --refresh-btn-bg: #dde2ea;
            --refresh-btn-hover: #c6cdd9;
            --no-poster-bg: #e8ecf3;
            --no-poster-text: #8a91a0;
            --tag-bg: rgba(0, 0, 0, .04);
            --progress-bg: #e8ecf3;
            --code-bg: #e8ecf3;
            --opt-bg: #ffffff;
            --radius: 18px;
            --radius-sm: 13px;
            --radius-xs: 9px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(120deg, rgba(45, 212, 191, .13), transparent 45%),
                linear-gradient(300deg, rgba(125, 211, 252, .11), transparent 45%),
                radial-gradient(700px 380px at 65% 0%, rgba(52, 211, 153, .10), transparent),
                radial-gradient(500px 300px at 15% 60%, rgba(125, 211, 252, .06), transparent),
                var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 200px;
            flex-shrink: 0;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border-right: 1px solid var(--border);
            padding: 16px 0;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .sidebar .logo {
            padding: 0 16px 16px;
            font-size: 17px;
            font-weight: 800;
            background: linear-gradient(90deg, var(--c1), var(--c3), var(--c2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sidebar nav {
            display: flex;
            flex-direction: column;
        }

        .sidebar nav a {
            padding: 10px 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: .15s;
        }

        .sidebar nav a:hover {
            background: var(--bg-hover);
            color: var(--text);
        }

        .sidebar nav a.active {
            background: var(--accent-bg);
            color: var(--accent-text);
            font-weight: 600;
        }

        .main {
            flex: 1;
            padding: 20px 24px;
            max-width: 1400px;
        }

        .page-title {
            font-size: 22px;
            margin: 0 0 16px;
            font-weight: 700;
        }

        a {
            color: var(--accent);
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        button.secondary,
        button.secondary.small {
            padding: 9px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            background: var(--bg-hover);
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            transition: .15s;
            backdrop-filter: blur(10px);
        }

        button.secondary:hover {
            border-color: var(--c1);
            background: rgba(255, 255, 255, .1);
        }

        button.secondary.small {
            padding: 7px 12px;
            font-size: 12px;
        }

        input,
        select,
        textarea {
            background: var(--bg-hover);
            color: var(--text);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 14px;
            backdrop-filter: blur(10px);
            transition: .15s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--c1);
            box-shadow: 0 0 0 3px rgba(45, 212, 191, .12);
        }

        select {
            background-color: var(--bg-hover);
        }

        select option {
            background-color: var(--opt-bg);
            color: var(--text);
        }

        /* Flash-уведомления */
        .message,
        .error {
            position: relative;
            padding: 14px 48px 14px 16px;
            border-radius: var(--radius);
            margin-bottom: 16px;
            font-size: 14px;
            animation: flash-in .4s ease-out;
            backdrop-filter: blur(10px);
        }

        .message {
            background: rgba(110, 231, 183, .12);
            border: 1px solid rgba(110, 231, 183, .4);
        }

        .error {
            background: rgba(253, 164, 175, .12);
            border: 1px solid rgba(253, 164, 175, .4);
        }

        @keyframes flash-in {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes flash-out {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
                transform: translateY(-12px);
            }
        }

        .message.flash-hide,
        .error.flash-hide {
            animation: flash-out .4s ease-in forwards;
        }

        .flash-close {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            background: none;
            border: 0;
            color: inherit;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            opacity: .7;
            padding: 4px 8px;
        }

        .flash-close:hover {
            opacity: 1;
        }

        .empty {
            color: var(--text-muted);
        }

        .hint {
            font-size: 12px;
            color: var(--text-dim);
        }

        @media (max-width:700px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: static;
            }

            .sidebar .logo {
                display: none;
            }

            .sidebar nav {
                flex-direction: row;
                overflow-x: auto;
                width: 100%;
            }

            .sidebar nav a {
                white-space: nowrap;
            }

            .main {
                padding: 16px;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>
    <aside class="sidebar">
        <div class="logo">🎬 Movie Radar</div>
        <nav>
            <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">📋 Список</a>
            <a href="/new" class="{% if request.url.path == '/new' %}active{% endif %}">➕ Добавить</a>
            <a href="/downloads" class="{% if request.url.path == '/downloads' %}active{% endif %}">📥 Загрузки</a>
            <a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}">⚙ Настройки</a>
        </nav>
    </aside>
    <main class="main">
        {% block content %}{% endblock %}
    </main>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
        }
        // Одноразовые подсказки: убираем ?msg= / ?err= из URL после загрузки
        (function () {
            try {
                var u = new URL(window.location.href);
                var changed = false;
                ['msg', 'err'].forEach(function (k) {
                    if (u.searchParams.has(k)) { u.searchParams.delete(k); changed = true; }
                });
                if (changed) {
                    var cleanUrl = u.pathname + (u.search || '') + (u.hash || '');
                    window.history.replaceState({}, '', cleanUrl);
                }
            } catch (e) { }
        })();
        // Крестик + автоскрытие через 2 минуты
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.message, .error').forEach(function (el) {
                var b = document.createElement('button');
                b.type = 'button'; b.className = 'flash-close'; b.innerHTML = '&times;'; b.title = 'Закрыть';
                b.addEventListener('click', function () { hideFlash(el); });
                el.appendChild(b);
                setTimeout(function () { hideFlash(el); }, 120000);
            });
            function hideFlash(el) {
                if (el.classList.contains('flash-hide')) return;
                el.classList.add('flash-hide');
                setTimeout(function () { el.remove(); }, 400);
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>
