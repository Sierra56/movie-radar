<!DOCTYPE html>
<html lang="ru" data-theme="{{ get_theme() }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#faf6ee">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/icon.svg">
    <title>{% block title %}Movie Radar{% endblock %}</title>
    <style>
        /* ═══ Дизайн-система: Popcorn (светлая) + Нуар (тёмная) ═══ */
        [data-theme="light"] {
            --bg: #faf6ee;
            --bg-card: #fff;
            --bg-hover: #f5efe0;
            --bg-section: #fff;
            --text: #1c1815;
            --text-muted: #6b5d4d;
            --text-faint: #9c8e7a;
            --text-dim: #b8ab96;
            --accent: #c0392b;
            --accent-bg: rgba(192, 57, 43, .10);
            --accent-text: #c0392b;
            --c1: #c0392b;
            --c2: #8b1e1e;
            --c3: #f4b942;
            --border: #e8dcc4;
            --border-light: #d8c9a8;
            --success: #2d8659;
            --warning-bg: rgba(244, 185, 66, .15);
            --warning-text: #b8860b;
            --error: #c0392b;
            --delete-btn-bg: #c0392b;
            --delete-btn-hover: #8b1e1e;
            --refresh-btn-bg: #f5efe0;
            --refresh-btn-hover: #e8dcc4;
            --no-poster-bg: #f0e8d5;
            --no-poster-text: #9c8e7a;
            --tag-bg: #faf6ee;
            --progress-bg: #e8dcc4;
            --code-bg: #f0e8d5;
            --opt-bg: #ffffff;
            --radius: 12px;
            --radius-sm: 10px;
            --radius-xs: 8px;
        }

        [data-theme="dark"] {
            --bg: #120d0e;
            --bg-card: rgba(30, 20, 22, .6);
            --bg-hover: rgba(40, 28, 30, .7);
            --bg-section: rgba(30, 20, 22, .6);
            --text: #f5e6d3;
            --text-muted: #a8897a;
            --text-faint: #7d655a;
            --text-dim: #5c4a42;
            --accent: #c0392b;
            --accent-bg: rgba(192, 57, 43, .15);
            --accent-text: #ff6b6b;
            --c1: #c0392b;
            --c2: #3b82f6;
            --c3: #8b1e1e;
            --border: rgba(192, 57, 43, .22);
            --border-light: rgba(168, 137, 122, .3);
            --success: #a3b18a;
            --warning-bg: rgba(244, 185, 66, .15);
            --warning-text: #f4b942;
            --error: #ff6b6b;
            --delete-btn-bg: rgba(255, 107, 107, .15);
            --delete-btn-hover: rgba(255, 107, 107, .25);
            --refresh-btn-bg: rgba(255, 255, 255, .05);
            --refresh-btn-hover: rgba(255, 255, 255, .1);
            --no-poster-bg: rgba(255, 245, 227, .06);
            --no-poster-text: #7d655a;
            --tag-bg: rgba(192, 57, 43, .12);
            --progress-bg: rgba(255, 255, 255, .08);
            --code-bg: rgba(255, 255, 255, .05);
            --opt-bg: #1a1214;
            --radius: 14px;
            --radius-sm: 11px;
            --radius-xs: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background:
                radial-gradient(900px 500px at 15% 0%, rgba(192, 57, 43, .06), transparent),
                radial-gradient(800px 450px at 90% 15%, rgba(59, 130, 246, .04), transparent),
                var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 200px;
            flex-shrink: 0;
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            border-right: 1px solid var(--border);
            padding: 16px 0;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .sidebar .logo {
            padding: 0 16px 16px;
            font-size: 17px;
            font-weight: 800;
            background: linear-gradient(90deg, var(--c1), var(--c2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        [data-theme="light"] .sidebar .logo {
            color: var(--c1);
            background: none;
            -webkit-text-fill-color: initial;
        }

        .sidebar nav {
            display: flex;
            flex-direction: column;
        }

        .sidebar nav a {
            padding: 10px 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: .15s;
        }

        .sidebar nav a:hover {
            background: var(--bg-hover);
            color: var(--text);
        }

        .sidebar nav a.active {
            background: var(--accent-bg);
            color: var(--accent-text);
            font-weight: 600;
        }

        .main {
            flex: 1;
            padding: 20px 24px;
            width: 100%;
        }

        .page-title {
            font-size: 22px;
            margin: 0 0 16px;
            font-weight: 700;
        }

        a {
            color: var(--accent);
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        button.secondary,
        button.secondary.small {
            padding: 9px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            background: var(--bg-hover);
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            transition: .15s;
        }

        button.secondary:hover {
            border-color: var(--c1);
            background: var(--refresh-btn-hover);
        }

        button.secondary.small {
            padding: 7px 12px;
            font-size: 12px;
        }

        input,
        select,
        textarea {
            background: var(--bg-hover);
            color: var(--text);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 14px;
            transition: .15s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--c1);
            box-shadow: 0 0 0 3px rgba(192, 57, 43, .12);
        }

        select {
            background-color: var(--bg-hover);
        }

        select option {
            background-color: var(--opt-bg);
            color: var(--text);
        }

        /* Flash-уведомления */
        .message,
        .error {
            position: relative;
            padding: 14px 48px 14px 16px;
            border-radius: var(--radius);
            margin-bottom: 16px;
            font-size: 14px;
            animation: flash-in .4s ease-out;
        }

        .message {
            background: rgba(45, 134, 89, .10);
            border: 1px solid rgba(45, 134, 89, .35);
            color: #1a5c3a;
        }

        [data-theme="dark"] .message {
            background: rgba(163, 177, 138, .12);
            border-color: rgba(163, 177, 138, .4);
            color: #c9d8b5;
        }

        .error {
            background: rgba(192, 57, 43, .10);
            border: 1px solid rgba(192, 57, 43, .35);
            color: #8b1e1e;
        }

        [data-theme="dark"] .error {
            background: rgba(255, 107, 107, .12);
            border-color: rgba(255, 107, 107, .4);
            color: #ffb8b8;
        }

        @keyframes flash-in {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes flash-out {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
                transform: translateY(-12px);
            }
        }

        .message.flash-hide,
        .error.flash-hide {
            animation: flash-out .4s ease-in forwards;
        }

        .flash-close {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            background: none;
            border: 0;
            color: inherit;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            opacity: .7;
            padding: 4px 8px;
        }

        .flash-close:hover {
            opacity: 1;
        }

        .empty {
            color: var(--text-muted);
        }

        .hint {
            font-size: 12px;
            color: var(--text-dim);
        }

        @media (max-width:700px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: static;
            }

            .sidebar .logo {
                display: none;
            }

            .sidebar nav {
                flex-direction: row;
                overflow-x: auto;
                width: 100%;
            }

            .sidebar nav a {
                white-space: nowrap;
            }

            .main {
                padding: 16px;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>
    <aside class="sidebar">
        <div class="logo">🎬 Movie Radar</div>
        <nav>
            <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">📋 Список</a>
            <a href="/new" class="{% if request.url.path == '/new' %}active{% endif %}">➕ Добавить</a>
            <a href="/downloads" class="{% if request.url.path == '/downloads' %}active{% endif %}">📥 Загрузки</a>
            <a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}">⚙ Настройки</a>
        </nav>
    </aside>
    <main class="main">
        {% block content %}{% endblock %}
    </main>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
        }
        (function () {
            try {
                var u = new URL(window.location.href);
                var changed = false;
                ['msg', 'err'].forEach(function (k) {
                    if (u.searchParams.has(k)) { u.searchParams.delete(k); changed = true; }
                });
                if (changed) {
                    var cleanUrl = u.pathname + (u.search || '') + (u.hash || '');
                    window.history.replaceState({}, '', cleanUrl);
                }
            } catch (e) { }
        })();
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.message, .error').forEach(function (el) {
                var b = document.createElement('button');
                b.type = 'button'; b.className = 'flash-close'; b.innerHTML = '&times;'; b.title = 'Закрыть';
                b.addEventListener('click', function () { hideFlash(el); });
                el.appendChild(b);
                setTimeout(function () { hideFlash(el); }, 120000);
            });
            function hideFlash(el) {
                if (el.classList.contains('flash-hide')) return;
                el.classList.add('flash-hide');
                setTimeout(function () { el.remove(); }, 400);
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>
