<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Movie Radar{% endblock %}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            background: #10131a;
            color: #e9ecf3;
            font: 16px/1.4 system-ui, sans-serif;
        }

        a {
            color: #4f8cff;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            background: #0c0f14;
            padding: 24px 16px;
            border-right: 1px solid #1a1f2b;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar .brand {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 28px;
            padding: 0 10px;
        }

        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            text-decoration: none;
            color: #9aa3b8;
            font-size: 15px;
        }

        .sidebar nav a:hover {
            background: #1a1f2b;
            color: #e9ecf3;
        }

        .sidebar nav a.active {
            background: #274067;
            color: #fff;
        }

        .content {
            flex: 1;
            padding: 24px;
            max-width: 1200px;
        }

        h1.page-title {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .error {
            color: #ff7b7b;
            margin: 8px 0;
        }

        .message {
            color: #7bd88f;
            margin: 8px 0;
        }

        button {
            padding: 10px 18px;
            border: 0;
            border-radius: 8px;
            background: #4f8cff;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #3a78eb;
        }

        button.secondary {
            background: #2a3140;
        }

        button.secondary:hover {
            background: #343d4f;
        }

        button.small {
            padding: 6px 12px;
            font-size: 13px;
        }

        input,
        select {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #2a3140;
            background: #1a1f2b;
            color: inherit;
            font-size: 15px;
        }

        input[type=checkbox] {
            width: 20px;
            height: 20px;
        }

        @media (max-width: 768px) {
            .layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: 0;
                border-bottom: 1px solid #1a1f2b;
                padding: 14px 12px;
                position: static;
                height: auto;
            }

            .sidebar .brand {
                display: none;
            }

            .sidebar nav {
                flex-direction: row;
                gap: 4px;
            }

            .sidebar nav a {
                flex: 1;
                justify-content: center;
                padding: 8px 10px;
                font-size: 13px;
            }

            .content {
                padding: 16px;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">🎬 Movie Radar</div>
            <nav>
                <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">📋 Список</a>
                <a href="/new" class="{% if request.url.path == '/new' %}active{% endif %}">➕ Добавить</a>
                <a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}">⚙ Настройки</a>
            </nav>
        </aside>
        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
    {% block extra_js %}{% endblock %}
</body>

</html>
