<!DOCTYPE html>
<html lang="ru" data-theme="{{ get_theme() }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0a0c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/icon.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <title>{% block title %}Movie Radar{% endblock %}</title>
    <style>
        /* ═══ Дизайн-система: Film Noir (тёмная) + адаптация (светлая) ═══ */
        [data-theme="dark"] {
            --bg: #0a0a0c;
            --bg-card: rgba(255, 255, 255, .04);
            --bg-hover: rgba(255, 255, 255, .06);
            --bg-section: rgba(255, 255, 255, .04);
            --text: #e8eef8;
            --text-muted: #8a97b0;
            --text-faint: #5c6880;
            --text-dim: #454f63;
            --accent: #3b82f6;
            --accent-bg: rgba(59, 130, 246, .12);
            --accent-text: #60a5fa;
            --c1: #3b82f6;
            --c2: #60a5fa;
            --c3: #e50914;
            --border: rgba(120, 180, 255, .18);
            --border-light: rgba(138, 151, 176, .25);
            --success: #6ee7b7;
            --warning-bg: rgba(244, 185, 66, .15);
            --warning-text: #f4b942;
            --error: #ff6b6b;
            --delete-btn-bg: rgba(255, 107, 107, .15);
            --delete-btn-hover: rgba(255, 107, 107, .25);
            --refresh-btn-bg: rgba(255, 255, 255, .05);
            --refresh-btn-hover: rgba(255, 255, 255, .1);
            --no-poster-bg: rgba(255, 255, 255, .05);
            --no-poster-text: #5c6880;
            --tag-bg: rgba(255, 255, 255, .05);
            --progress-bg: rgba(255, 255, 255, .08);
            --code-bg: rgba(255, 255, 255, .05);
            --opt-bg: #12141c;
            --radius: 12px;
            --radius-sm: 10px;
            --radius-xs: 8px;
        }

        [data-theme="light"] {
            --bg: #f0f3f8;
            --bg-card: #fff;
            --bg-hover: #e5eaf3;
            --bg-section: #fff;
            --text: #10141c;
            --text-muted: #4a5568;
            --text-faint: #718096;
            --text-dim: #a0aec0;
            --accent: #2563eb;
            --accent-bg: rgba(37, 99, 235, .10);
            --accent-text: #2563eb;
            --c1: #2563eb;
            --c2: #3b82f6;
            --c3: #dc2626;
            --border: #d0d7e4;
            --border-light: #b8c2d4;
            --success: #16a34a;
            --warning-bg: rgba(245, 158, 11, .15);
            --warning-text: #b45309;
            --error: #dc2626;
            --delete-btn-bg: #dc2626;
            --delete-btn-hover: #b91c1c;
            --refresh-btn-bg: #e5eaf3;
            --refresh-btn-hover: #d0d7e4;
            --no-poster-bg: #e5eaf3;
            --no-poster-text: #a0aec0;
            --tag-bg: #f0f3f8;
            --progress-bg: #d0d7e4;
            --code-bg: #e5eaf3;
            --opt-bg: #ffffff;
            --radius: 12px;
            --radius-sm: 10px;
            --radius-xs: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background:
                radial-gradient(600px 400px at 20% 10%, rgba(59, 130, 246, .08), transparent),
                radial-gradient(500px 300px at 80% 30%, rgba(229, 9, 20, .04), transparent),
                var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            min-height: 100vh;
        }

        /* ═══ Сайдбар (десктоп) ═══ */
        .sidebar {
            width: 200px;
            flex-shrink: 0;
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            border-right: 1px solid var(--border);
            padding: 16px 0;
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .sidebar .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px 16px;
            font-size: 16px;
            font-weight: 800;
            color: var(--c2);
            letter-spacing: .01em;
        }

        .sidebar .logo i {
            font-size: 19px;
        }

        [data-theme="light"] .sidebar .logo {
            color: var(--c1);
        }

        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sidebar nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            margin: 0 8px;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: .15s;
        }

        .sidebar nav a i {
            font-size: 17px;
            width: 17px;
            text-align: center;
            flex-shrink: 0;
        }

        .sidebar nav a:hover {
            background: var(--bg-hover);
            color: var(--text);
        }

        .sidebar nav a.active {
            background: var(--accent-bg);
            color: var(--accent-text);
            font-weight: 600;
        }

        /* ═══ Верхняя мини-шапка (мобильная, только логотип) ═══ */
        .mobile-topbar {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 14px 16px;
            font-size: 15px;
            font-weight: 800;
            color: var(--c2);
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            position: sticky;
            top: 0;
            z-index: 40;
        }

        [data-theme="light"] .mobile-topbar {
            color: var(--c1);
        }

        .mobile-topbar i {
            font-size: 18px;
        }

        /* ═══ Нижняя таб-бар (мобильная навигация) ═══ */
        .mobile-tabbar {
            display: none;
        }

        .main {
            flex: 1;
            padding: 20px 24px;
            width: 100%;
            min-width: 0;
        }

        .page-title {
            font-size: 22px;
            margin: 0 0 16px;
            font-weight: 700;
        }

        a {
            color: var(--accent);
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        button.secondary,
        button.secondary.small {
            padding: 9px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            background: var(--bg-hover);
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            transition: .15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        button.secondary:hover {
            border-color: var(--c1);
            background: var(--refresh-btn-hover);
        }

        button.secondary.small {
            padding: 7px 12px;
            font-size: 12px;
        }

        input,
        select,
        textarea {
            background: var(--bg-hover);
            color: var(--text);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 14px;
            transition: .15s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--c1);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, .15);
        }

        select {
            background-color: var(--bg-hover);
        }

        select option {
            background-color: var(--opt-bg);
            color: var(--text);
        }

        /* Flash-уведомления */
        .message,
        .error {
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 14px 48px 14px 16px;
            border-radius: var(--radius);
            margin-bottom: 16px;
            font-size: 14px;
            animation: flash-in .4s ease-out;
        }

        .message i,
        .error i {
            font-size: 17px;
            margin-top: 1px;
            flex-shrink: 0;
        }

        .message {
            background: rgba(110, 231, 183, .10);
            border: 1px solid rgba(110, 231, 183, .4);
            color: #6ee7b7;
        }

        [data-theme="light"] .message {
            background: rgba(22, 163, 74, .08);
            border-color: rgba(22, 163, 74, .3);
            color: #166534;
        }

        .error {
            background: rgba(255, 107, 107, .10);
            border: 1px solid rgba(255, 107, 107, .4);
            color: #ff6b6b;
        }

        [data-theme="light"] .error {
            background: rgba(220, 38, 38, .08);
            border-color: rgba(220, 38, 38, .3);
            color: #991b1b;
        }

        @keyframes flash-in {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes flash-out {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
                transform: translateY(-12px);
            }
        }

        .message.flash-hide,
        .error.flash-hide {
            animation: flash-out .4s ease-in forwards;
        }

        .flash-close {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            background: none;
            border: 0;
            color: inherit;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            opacity: .7;
            padding: 6px;
        }

        .flash-close:hover {
            opacity: 1;
        }

        .empty {
            color: var(--text-muted);
        }

        .hint {
            font-size: 12px;
            color: var(--text-dim);
        }

        /* ═══ Мобильная раскладка ═══ */
        @media (max-width:700px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                display: none;
            }

            .mobile-topbar {
                display: flex;
            }

            .main {
                padding: 16px;
                padding-bottom: calc(76px + env(safe-area-inset-bottom));
            }

            .mobile-tabbar {
                display: flex;
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 50;
                background: var(--bg-card);
                backdrop-filter: blur(16px);
                border-top: 1px solid var(--border);
                padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
            }

            .mobile-tabbar a {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 3px;
                padding: 6px 4px;
                border-radius: var(--radius-sm);
                color: var(--text-faint);
                text-decoration: none;
                font-size: 10px;
                font-weight: 600;
            }

            .mobile-tabbar a i {
                font-size: 20px;
            }

            .mobile-tabbar a.active {
                color: var(--accent-text);
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>
    <aside class="sidebar">
        <div class="logo"><i class="ti ti-radar" aria-hidden="true"></i>Movie Radar</div>
        <nav>
            <a href="/" class="{% if request.url.path == '/' %}active{% endif %}"><i class="ti ti-list"
                    aria-hidden="true"></i>Список</a>
            <a href="/new" class="{% if request.url.path == '/new' %}active{% endif %}"><i class="ti ti-plus"
                    aria-hidden="true"></i>Добавить</a>
            <a href="/downloads" class="{% if request.url.path == '/downloads' %}active{% endif %}"><i
                    class="ti ti-download" aria-hidden="true"></i>Загрузки</a>
            <a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}"><i
                    class="ti ti-settings" aria-hidden="true"></i>Настройки</a>
        </nav>
    </aside>

    <div class="mobile-topbar"><i class="ti ti-radar" aria-hidden="true"></i>Movie Radar</div>

    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <nav class="mobile-tabbar" aria-label="Основная навигация">
        <a href="/" class="{% if request.url.path == '/' %}active{% endif %}"><i class="ti ti-list"
                aria-hidden="true"></i>Список</a>
        <a href="/new" class="{% if request.url.path == '/new' %}active{% endif %}"><i class="ti ti-plus"
                aria-hidden="true"></i>Добавить</a>
        <a href="/downloads" class="{% if request.url.path == '/downloads' %}active{% endif %}"><i
                class="ti ti-download" aria-hidden="true"></i>Загрузки</a>
        <a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}"><i class="ti ti-settings"
                aria-hidden="true"></i>Настройки</a>
    </nav>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
        }
        (function () {
            try {
                var u = new URL(window.location.href);
                var changed = false;
                ['msg', 'err'].forEach(function (k) {
                    if (u.searchParams.has(k)) { u.searchParams.delete(k); changed = true; }
                });
                if (changed) {
                    var cleanUrl = u.pathname + (u.search || '') + (u.hash || '');
                    window.history.replaceState({}, '', cleanUrl);
                }
            } catch (e) { }
        })();
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.message, .error').forEach(function (el) {
                var icon = document.createElement('i');
                icon.className = el.classList.contains('error') ? 'ti ti-alert-circle' : 'ti ti-circle-check';
                icon.setAttribute('aria-hidden', 'true');
                el.insertBefore(icon, el.firstChild);

                var b = document.createElement('button');
                b.type = 'button'; b.className = 'flash-close'; b.setAttribute('aria-label', 'Закрыть');
                b.innerHTML = '<i class="ti ti-x" aria-hidden="true"></i>';
                b.addEventListener('click', function () { hideFlash(el); });
                el.appendChild(b);
                setTimeout(function () { hideFlash(el); }, 120000);
            });
            function hideFlash(el) {
                if (el.classList.contains('flash-hide')) return;
                el.classList.add('flash-hide');
                setTimeout(function () { el.remove(); }, 400);
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>
