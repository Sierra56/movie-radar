<!DOCTYPE html>
<html lang="ru" data-theme="{{ get_theme() }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#12141a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/icon.svg">
    <title>{% block title %}Movie Radar{% endblock %}</title>
    <style>
        :root,
        [data-theme="dark"] {
            --bg: #12141a;
            --bg-card: #1a1d26;
            --bg-hover: #232734;
            --bg-section: #1a1d26;
            --text: #e8eaf0;
            --text-muted: #9aa1b0;
            --text-faint: #6b7280;
            --text-dim: #565d6b;
            --accent: #4f8cff;
            --accent-bg: rgba(79, 140, 255, .15);
            --accent-text: #8ab4ff;
            --border: #2a2f3d;
            --border-light: #3a4152;
            --success: #3ddc84;
            --warning-bg: rgba(245, 166, 35, .15);
            --warning-text: #f5a623;
            --error: #ff5c5c;
            --delete-btn-bg: #a33;
            --delete-btn-hover: #c44;
            --refresh-btn-bg: #3a4152;
            --refresh-btn-hover: #4a5162;
            --no-poster-bg: #232734;
            --no-poster-text: #6b7280;
            --tag-bg: rgba(0, 0, 0, .6);
            --progress-bg: #232734;
            --code-bg: #232734;
        }

        [data-theme="light"] {
            --bg: #f4f6fa;
            --bg-card: #fff;
            --bg-hover: #e8ecf3;
            --bg-section: #fff;
            --text: #1a1d26;
            --text-muted: #565d6b;
            --text-faint: #8a91a0;
            --text-dim: #a0a7b5;
            --accent: #2563eb;
            --accent-bg: rgba(37, 99, 235, .12);
            --accent-text: #2563eb;
            --border: #dde2ea;
            --border-light: #c6cdd9;
            --success: #16a34a;
            --warning-bg: rgba(217, 119, 6, .12);
            --warning-text: #b45309;
            --error: #dc2626;
            --delete-btn-bg: #dc2626;
            --delete-btn-hover: #b91c1c;
            --refresh-btn-bg: #dde2ea;
            --refresh-btn-hover: #c6cdd9;
            --no-poster-bg: #e8ecf3;
            --no-poster-text: #8a91a0;
            --tag-bg: rgba(0, 0, 0, .5);
            --progress-bg: #e8ecf3;
            --code-bg: #e8ecf3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 200px;
            flex-shrink: 0;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 16px 0;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .sidebar .logo {
            padding: 0 16px 16px;
            font-size: 17px;
            font-weight: 700;
            color: var(--accent);
        }

        .sidebar nav {
            display: flex;
            flex-direction: column;
        }

        .sidebar nav a {
            padding: 10px 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
        }

        .sidebar nav a:hover {
            background: var(--bg-hover);
            color: var(--text);
        }

        .sidebar nav a.active {
            background: var(--accent-bg);
            color: var(--accent-text);
        }

        .main {
            flex: 1;
            padding: 20px 24px;
            width: 100%;
        }

        .page-title {
            font-size: 22px;
            margin: 0 0 16px;
        }

        a {
            color: var(--accent);
        }

        button {
            font-family: inherit;
        }

        button.secondary {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-light);
            background: var(--bg-hover);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
        }

        button.secondary:hover {
            background: var(--border-light);
        }

        button.secondary.small {
            padding: 6px 10px;
            font-size: 12px;
        }

        input,
        select,
        textarea {
            background: var(--bg-hover);
            color: var(--text);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 14px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .message {
            background: var(--accent-bg);
            color: var(--accent-text);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .error {
            background: var(--warning-bg);
            color: var(--warning-text);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .empty {
            color: var(--text-muted);
        }

        .hint {
            font-size: 12px;
            color: var(--text-dim);
        }

        @media (max-width:700px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: static;
            }

            .sidebar .logo {
                display: none;
            }

            .sidebar nav {
                flex-direction: row;
                overflow-x: auto;
                width: 100%;
            }

            .sidebar nav a {
                white-space: nowrap;
            }

            .main {
                padding: 16px;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>
    <aside class="sidebar">
        <div class="logo">🎬 Movie Radar</div>
        <nav>
            <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">📋 Список</a>
            <a href="/new" class="{% if request.url.path == '/new' %}active{% endif %}">➕ Добавить</a>
            <a href="/downloads" class="{% if request.url.path == '/downloads' %}active{% endif %}">📥 Загрузки</a>
            <a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}">⚙ Настройки</a>
        </nav>
    </aside>
    <main class="main">
        {% block content %}{% endblock %}
    </main>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>
