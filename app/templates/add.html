{% extends "base.html" %}
{% block title %}Добавить{% endblock %}

{% block extra_css %}
<style>
    .add-panel {
        background: var(--bg-card);
        backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 22px;
        max-width: 640px;
    }

    .field {
        display: flex;
        flex-direction: column;
        margin-bottom: 14px;
    }

    .field label {
        font-size: 13px;
        color: var(--text-muted);
        margin-bottom: 6px;
    }

    .field input,
    .field select {
        width: 100%;
    }

    .btn {
        border: 0;
        cursor: pointer;
        border-radius: var(--radius-sm);
        padding: 10px 18px;
        font-size: 13px;
        font-weight: 700;
        transition: .15s;
    }

    .btn.p {
        background: linear-gradient(90deg, var(--c1), var(--c3));
        color: #04151a;
        box-shadow: 0 0 14px rgba(45, 212, 191, .3);
    }

    .btn.p:hover {
        filter: brightness(1.1);
    }

    .btn.s {
        background: var(--bg-hover);
        color: var(--text);
        border: 1px solid var(--border-light);
    }

    .btn.s:hover {
        border-color: var(--c1);
    }

    .btn-row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
    }

    .divider {
        border-top: 1px solid var(--border);
        margin: 18px 0;
    }

    .results {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
        margin-top: 18px;
    }

    .result-card {
        background: var(--bg-card);
        backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        overflow: hidden;
        cursor: pointer;
        transition: .2s;
    }

    .result-card:hover {
        transform: translateY(-3px);
        border-color: var(--c1);
        box-shadow: 0 0 20px rgba(45, 212, 191, .18);
    }

    .result-card img {
        width: 100%;
        aspect-ratio: 2/3;
        object-fit: cover;
        display: block;
    }

    .result-card .no-poster {
        width: 100%;
        aspect-ratio: 2/3;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(150deg, rgba(45, 212, 191, .17), rgba(125, 211, 252, .14));
        color: var(--no-poster-text);
        font-size: 11px;
    }

    .result-card .rc-info {
        padding: 8px 10px;
    }

    .result-card .rc-title {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.3;
    }

    .result-card .rc-meta {
        font-size: 11px;
        color: var(--text-faint);
        margin-top: 2px;
    }

    #search-status {
        color: var(--text-muted);
        font-size: 13px;
        margin-top: 12px;
    }
</style>
{% endblock %}

{% block content %}
<h1 class="page-title">➕ Добавить</h1>

{% if message %}<p class="message">{{ message }}</p>{% endif %}
{% if error_message %}<p class="error">{{ error_message }}</p>{% endif %}

<div class="add-panel">
    <form id="search-form">
        <div class="field">
            <label>Название фильма или сериала</label>
            <input type="text" id="q" name="q" placeholder="Например: Основание" autocomplete="off" required>
        </div>
        <div class="field">
            <label>Источник</label>
            <select id="source" name="source">
                {% for s in sources %}
                <option value="{{ s }}" {% if s==default_source %}selected{% endif %}>{{ s|upper }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="btn-row">
            <button type="submit" class="btn p">🔍 Найти</button>
            <button type="button" class="btn s"
                onclick="document.getElementById('manual-form').style.display='block'; this.style.display='none';">✍️
                Ввести вручную</button>
        </div>
    </form>

    <form id="manual-form" method="post" action="/add" style="display:none; margin-top:16px;">
        <div class="divider"></div>
        <div class="field">
            <label>Название</label>
            <input type="text" name="title" required>
        </div>
        <div class="field">
            <label>Дата релиза (опционально)</label>
            <input type="date" name="release_date">
        </div>
        <div class="btn-row"><button type="submit" class="btn p">Добавить локально</button></div>
    </form>

    <div id="search-status"></div>
    <div class="results" id="results"></div>
</div>

<form id="add-form" method="post" action="/add-select" style="display:none;">
    <input type="hidden" name="external_id" id="add-id">
    <input type="hidden" name="source" id="add-source">
</form>
{% endblock %}

{% block extra_js %}
<script>
    const searchForm = document.getElementById('search-form');
    const results = document.getElementById('results');
    const status = document.getElementById('search-status');
    const addForm = document.getElementById('add-form');

    searchForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        const q = document.getElementById('q').value.trim();
        const source = document.getElementById('source').value;
        if (!q) return;
        status.textContent = 'Поиск...';
        results.innerHTML = '';
        try {
            const fd = new FormData();
            fd.append('query', q);
            fd.append('source', source);
            const r = await fetch('/search', { method: 'POST', body: fd });
            const d = await r.json();
            const list = d.candidates || [];
            if (!list.length) { status.textContent = 'Ничего не найдено.'; return; }
            status.textContent = `Найдено: ${list.length}`;
            list.forEach(c => {
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
        ${c.poster_url ? `<img src="${c.poster_url}" alt="">` : `<div class="no-poster">нет постера</div>`}
        <div class="rc-info">
          <div class="rc-title">${escapeHtml(c.title)}</div>
          <div class="rc-meta">${c.year || ''} ${c.type === 'series' ? '· Сериал' : c.type === 'movie' ? '· Фильм' : ''}</div>
        </div>`;
                card.addEventListener('click', () => selectCard(c, source));
                results.appendChild(card);
            });
        } catch (err) {
            status.textContent = 'Ошибка поиска.';
        }
    });

    function selectCard(c, source) {
        document.getElementById('add-id').value = c.external_id;
        document.getElementById('add-source').value = source;
        addForm.submit();
    }

    function escapeHtml(s) {
        return (s || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }
</script>
{% endblock %}
